name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes do bot + motor CoinMind
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts evita baixar o binário do Electron (não é necessário para testar)
      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rodar os testes (node:test)
        run: npm test

      - name: Rodar o bot headless (fumaça)
        env:
          COINMIND_DIR: ${{ runner.temp }}/coinmind-ci
        run: npm run bot -- --ciclos 30 --capital 1000 --semente 42

      - name: Conferir estado do motor
        env:
          COINMIND_DIR: ${{ runner.temp }}/coinmind-ci
        run: npm run bot -- --info
